name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p app
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)
          unzip -q "$ZIP_FILE" -d app

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find app -name pubspec.yaml | head -1)
          APP_DIR=$(dirname "$PUBSPEC")
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "Flutter project: $APP_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audit-stock-opname-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
